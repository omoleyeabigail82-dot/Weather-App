<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
  <meta name="description" content="Beautiful, animated weather forecasts for any city">
  <meta property="og:title" content="Weather Check - Live Forecasts">
  <meta property="og:description" content="Beautiful, animated weather forecasts for any city">
  <meta property="og:image" content="screenshot.png">
</head>
<body>


  <div class="sky-layer" id="skyLayer">
    <div class="sun"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="cloud cloud-4"></div>
    <div class="cloud cloud-5"></div>
    <div class="stars"></div>
    <div class="rain"></div>
    <div class="rain rain-2"></div>
  </div>


  <div class="weather-app">
    <h1>Weather Check</h1>


    <div class="search-bar">
      <input type="text" id="cityInput" placeholder="Enter city name..." aria-label="City name">
      <button id="searchBtn" aria-label="Search for weather">Search</button>
    </div>


    <div id="popularCities" class="popular-cities"></div>


    <div class="action-row">
      <button id="locationBtn" aria-label="Use my current location">📍 Use my location</button>
      <button id="unitToggle" aria-label="Toggle temperature unit">°C</button>
    </div>


    <button id="calendarToggle" class="calendar-toggle" aria-label="Pick a date for forecast">📅 Pick a date</button>
    <div id="calendar" class="calendar hidden"></div>


    <div id="recentSearches" class="recent-searches"></div>


    <div id="result" class="result" role="status" aria-live="polite">
      <p class="placeholder">Search a city to see the weather</p>
    </div>


    <div id="hourly" class="hourly" aria-label="Hourly forecast"></div>


    <div id="forecast" class="forecast" aria-label="Daily forecast"></div>


    <div id="sunMoon" class="sun-moon" aria-label="Sun and moon times"></div>


  </div>


  <script src="script.js"></script>
</body>
</html>
